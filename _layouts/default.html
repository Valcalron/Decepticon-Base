<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: "Decepticon Base" }}</title>

  <style>
    :root{
      --border:rgba(255,255,255,0.14);
      --text:#e7eef8;
      --link:#9cc7ff;
      --sidebar:220px;
    }

    *{ box-sizing:border-box; }

    /* ===== BODY: CYBERTRON BACKGROUND ON EVERY PAGE ===== */
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);

      /* Cybertron background */
      background-image: url("{{ '/assets/Cybertronleft.png' | relative_url }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed; /* scroll over background */
    }

    /* FULL PAGE WRAPPER */
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* ===== TOP BANNER ===== */
    .banner{
      width:100%;
      border-bottom:1px solid var(--border);
      background: rgba(0,0,0,0.85);
    }

    .banner img{
      width:100%;
      height:260px;          /* adjust: 180 small, 260 medium, 340 tall */
      object-fit:cover;
      display:block;
    }

    /* ===== MAIN LAYOUT ===== */
    .main{
      flex:1;
      display:flex;
      width:100%;
    }

    /* ===== LEFT NAV ===== */
    .nav{
      width:var(--sidebar);
      background: rgba(0,0,0,0.75);
      border-right:1px solid var(--border);
      padding:12px 10px;
    }

    .nav a{
      display:block;
      margin:6px 0;
      padding:8px 10px;
      color:var(--link);
      text-decoration:none;
      border-radius:8px;
    }

    .nav a:hover{
      background: rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
    }

    /* ===== CONTENT AREA ===== */
    .content{
      flex:1;
      padding:18px;
    }

    .content-inner{
      max-width:1100px;
      margin:0 auto;
      padding:18px;
      min-height:70vh;

      /* dark glass panel so text is readable over Cybertron */
      background: rgba(0,0,0,0.72);
      border:1px solid var(--border);
      border-radius:12px;
    }

    /* ===== FOOTER ===== */
    .footer{
      border-top:1px solid var(--border);
      background: rgba(0,0,0,0.85);
      padding:10px 12px;
      font-size:12px;
      opacity:0.9;
    }

    .footer a{
      color:var(--link);
    }

    /* ===== MOBILE FIX ===== */
    @media (max-width: 860px){
      .main{ flex-direction:column; }
      .nav{
        width:100%;
        border-right:none;
        border-bottom:1px solid var(--border);
      }
      .content-inner{ max-width:100%; }
      .banner img{ height:180px; }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- TOP BANNER -->
    <div class="banner">
      <img src="{{ '/assets/Decepticonbannor1.jpg' | relative_url }}"
           alt="Decepticon Base banner">
    </div>

    <div class="main">

      <!-- LEFT NAVIGATION -->
      <div class="nav">
        <a href="{{ '/' | relative_url }}">HOME</a>
        <a href="{{ '/hmw/' | relative_url }}">HMW</a>
        <a href="{{ '/art/' | relative_url }}">ART</a>

        <a href="https://forumsoundwave.jcink.net/index.php?act=idx"
           target="_blank" rel="noopener">FORUM</a>

        <a href="{{ '/fanfiction/' | relative_url }}">FANFICTION</a>
        <a href="{{ '/commissions/' | relative_url }}">COMMISSIONS</a>
        <a href="{{ '/sigs-gifts/' | relative_url }}">SIGS AND GIFTS</a>
        <a href="{{ '/lore/' | relative_url }}">LORE</a>
        <a href="{{ '/dda/' | relative_url }}">DDA</a>
        <a href="{{ '/disclaimer.html' | relative_url }}">DISCLAIMER</a>
      </div>

      <!-- PAGE CONTENT -->
      <div class="content">
        <div class="content-inner">
          {{ content }}
        </div>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      Transformers is property of Hasbro. This is a non-commercial fan site. No profit is made.
      <a href="{{ '/disclaimer.html' | relative_url }}">Disclaimer</a>
    </div>

  </div>
</body>
</html>
